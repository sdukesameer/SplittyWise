<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3A6"/><stop offset=".55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#m-bg)"/>
  <!-- Art kept inside the 80% safe zone so Android's mask cannot clip it. -->
  <g transform="translate(256 256) scale(.76) translate(-256 -256)">
  <!-- One disc, cut on the diagonal, halves pulled well apart so the split
         still registers at 40px. -->
    <g transform="rotate(-24 256 256)">
      <path d="M256 108 A148 148 0 0 0 256 404 Z" transform="translate(-25 0)" fill="#fff"/>
      <path d="M256 108 A148 148 0 0 1 256 404 Z" transform="translate(25 0)"  fill="#fff" fill-opacity=".58"/>
    </g>

    <!-- Rupee mark punched into the solid half. -->
    <g transform="translate(132 196) scale(2.2)" fill="none" stroke="#0C8C79" stroke-width="8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6h28M6 18h28M27 6c0 11-8 15-18 15l21 25"/>
    </g>
  </g>
</svg>
