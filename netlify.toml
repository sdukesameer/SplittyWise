# SplittyWise — static site, no build step.
[build]
  publish = "."

[build.environment]
  # Netlify's secret scanner fails the build if it finds the value of ANY
  # environment variable in the repo. SUPABASE_URL is in js/config.js on
  # purpose — it is the address the browser talks to, so it ships with the
  # app and cannot be secret. Same for SUPABASE_ANON_KEY, which only ever
  # grants what the RLS policies allow.
  #
  # SUPABASE_SERVICE_ROLE_KEY is deliberately NOT listed here. That one
  # bypasses every RLS policy, must never appear in the repo, and the
  # scanner catching it would be a genuine save rather than a nuisance.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# Email notifications. One function, called by a Supabase Database Webhook
# on new notification rows. Does nothing until its environment variables are
# set — see README 4.7.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The admin console is its own page, so it must be matched before the
# catch-all rewrite below. Netlify serves real files ahead of a non-forced
# rewrite anyway, but relying on that would make a one-word change to the
# rule silently serve the app in the console's place.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

# Hash routing means the server only ever serves index.html, but this keeps
# deep links working if a route is ever moved off the hash.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
#  Security headers
#
#  The CSP below is tight on scripts on purpose: the app has no inline
#  <script> at all, so it does not need 'unsafe-inline' there. Each allowance
#  is something the app genuinely uses:
#
#    cdn.jsdelivr.net        supabase-js, and tesseract.js for receipt OCR
#    blob: + wasm-unsafe-eval  Tesseract compiles WebAssembly in a worker
#    unpkg / tessdata...     where tesseract.js fetches its language data
#    *.supabase.co           the database, auth, and signed receipt URLs
#    wss://*.supabase.co     realtime notifications
#    fonts.googleapis/gstatic  the Nunito typeface
#    'unsafe-inline' on style  the app uses style="" attributes
#
#  If something breaks after a deploy, comment out this whole [[headers]]
#  block, redeploy, and check the browser console for which directive
#  blocked it — then add that one host back rather than dropping the lot.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co;
      connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com;
      manifest-src 'self';
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests
      """
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"

# App code must never be stale, or a logged-in user can end up running last
# week's JavaScript against this week's database.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must always be revalidated, or a stale one can pin the
# app to an old shell indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# The console is not part of the app and must never be cached or indexed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
